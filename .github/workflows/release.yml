name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      UNITY_VERSION: 6000.0.61f1
    defaults:
      run:
        shell: pwsh
        working-directory: CineCapture

    steps:
      - name: Check out release builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: CineCapture
          submodules: recursive
          persist-credentials: false

      - name: Read release version
        run: |
          $assemblyInfo = Get-Content -LiteralPath 'Properties/AssemblyInfo.cs' -Raw
          $match = [regex]::Match($assemblyInfo, 'AssemblyInformationalVersion\("([^"]+)"\)')
          if (-not $match.Success) {
            throw 'AssemblyInformationalVersion is missing from Properties/AssemblyInfo.cs.'
          }
          $tag = "v$($match.Groups[1].Value)"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "AssemblyInformationalVersion must use semantic versioning: $tag"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match AssemblyInfo version $tag."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify submodules
        run: |
          git submodule status --recursive
          if ($LASTEXITCODE -ne 0) {
            throw 'One or more release component submodules are unavailable.'
          }
          foreach ($project in 'CameraOperator/CameraOperator.csproj', 'FFmpegMediaWriter/FFmpegMediaWriter.csproj', 'UnityRuntimeCameraRecorder/UnityRuntimeCameraRecorder.csproj', 'Direct3DVideoEncoder/Direct3DVideoEncoder.vcxproj') {
            if (-not (Test-Path -LiteralPath "components/$project")) {
              throw "Submodule content is missing: $project"
            }
          }

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      # Install the editor only to reference its managed assemblies; do not launch it.
      - name: Set up Unity compilation references
        id: unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2
        with:
          version-file: None
          unity-version: ${{ env.UNITY_VERSION }}
          cache-installation: true

      - name: Build release package
        env:
          UNITY_EXECUTABLE: ${{ steps.unity.outputs.unity-editor-path }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe'
          if ($LASTEXITCODE -ne 0 -or -not $msbuild) {
            throw 'Visual Studio build tools were not found.'
          }
          $editorDirectory = Split-Path -Parent $env:UNITY_EXECUTABLE
          $managed = Join-Path $editorDirectory 'Data/Managed/UnityEngine'
          New-Item -ItemType Directory -Path artifacts/logs -Force | Out-Null
          & ($msbuild | Select-Object -First 1) CineCapture.proj /m /t:Package /p:Configuration=Release "/p:UnityManagedPath=$managed" "/p:UnityVersion=$env:UNITY_VERSION" /v:minimal /fl '/flp:logfile=artifacts/logs/release-build.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed with exit code $LASTEXITCODE."
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CineCapture-${{ env.RELEASE_TAG }}-windows-x64
          path: CineCapture/artifacts/CineCapture-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CineCapture-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: CineCapture/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-Item -LiteralPath "artifacts/CineCapture-$env:RELEASE_TAG-windows-x64.zip"
          $prerelease = $env:RELEASE_TAG.Contains('-')
          $arguments = @('release', 'create', $env:RELEASE_TAG, $archive.FullName, '--title', $env:RELEASE_TAG, '--generate-notes', '--verify-tag')
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $arguments = $arguments | Where-Object { $_ -ne '--verify-tag' }
            $arguments += @('--target', $env:GITHUB_SHA)
          }
          if ($prerelease) {
            $arguments += '--prerelease'
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to publish the GitHub release.'
          }
